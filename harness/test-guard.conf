# What counts as weakening the tests on a build branch. Read by harness/integrity.sh,
# which compares the branch with the commit it started from. One rule per line:
#   kind | pattern
#
#   test      glob (* also matches /) for test files. Deleting one that existed at the
#             start of the branch fails. Moving or renaming it is fine once the new path
#             is tracked (git add), and so is rewriting its contents.
#   marker    extended regex for a skip / ignore / suppression marker. Fails when the
#             branch adds more matching lines than it removes (spec/, harness/, .claude/
#             and *.md are not scanned). Write regexes without \b; awk doesn't know it.
#   config    glob for a test, lint or type-check config file. Changing or deleting one
#             that existed at the start of the branch fails.
#   pyproject regex alternation of tool names whose [tool.<name>...] sections in
#             pyproject.toml must stay as they were at the start of the branch.
#
# A human allows a deliberate change with HARNESS_ALLOW_PROTECTED_CHANGES=1 (CI sets it
# for PRs labelled "harness-change"). Deleting tests for a spec change belongs on the
# base branch, together with /spec.
# These rules only see what changes on the branch, so also pin strictness and test
# selection in harness/checks.conf (see the comments there).

test | tests/*
test | */tests/*
test | test/*
test | */test/*
test | __tests__/*
test | */__tests__/*
test | e2e/*
test | */e2e/*
test | test_*.py
test | */test_*.py
test | *_test.py
test | *_test.go
test | *.test.*
test | *.spec.*

# Python
marker | @pytest\.mark\.(skip|skipif|xfail)
marker | pytest\.(skip|xfail|importorskip)\(
marker | @unittest\.(skip|skipIf|skipUnless|expectedFailure)
marker | type:[[:space:]]*ignore
marker | #[[:space:]]*noqa
marker | pragma:[[:space:]]*no[[:space:]]*cover
marker | pylint:[[:space:]]*disable
# JavaScript / TypeScript
marker | (^|[^[:alnum:]_.])(it|test|describe|context|suite)\.(skip|todo|only|fixme)\(
marker | (^|[^[:alnum:]_.])x(it|test|describe)\(
marker | @ts-(ignore|nocheck|expect-error)
marker | eslint-disable
marker | (istanbul|c8|v8)[[:space:]]+ignore
# Go / Rust / JVM
marker | t\.Skip(f|Now)?\(
marker | //[[:space:]]*nolint
marker | #\[ignore\]
marker | @(Disabled|Ignore)([^[:alnum:]_]|$)

config | pytest.ini
config | mypy.ini
config | .mypy.ini
config | ruff.toml
config | .ruff.toml
config | .coveragerc
config | jest.config.*
config | vitest.config.*
config | playwright.config.*
config | .eslintrc*
config | eslint.config.*
config | .golangci.*
config | clippy.toml

pyproject | pytest|mypy|ruff|coverage|pyright|pylint
