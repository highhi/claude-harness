# Checks that define "done" for this repo. One per line:  name | command
# Commands run from the repo root. A non-zero exit fails the gate.
#
# Leave every line commented out to use auto-detection
# (package.json scripts / pyproject / go.mod / Cargo.toml).
# Once your project is real, list the checks explicitly: it's the single
# most important file in the harness.
#
# Pin strictness and test selection in the command itself, so the builder can't
# loosen them through project config (pyproject.toml, package.json scripts, ...):
# call the tool directly, pass strict flags, name the test paths, and override
# config-file options that could deselect tests. harness/integrity.sh also rejects
# config changes on build branches, but only for files that existed when the
# branch started; on a project's first build only these commands hold the line.
#
# Examples:
# typecheck | npx tsc --noEmit --strict
# lint      | npx eslint --max-warnings 0 .
# unit      | npx vitest run --passWithNoTests=false
# e2e       | npx playwright test
# typecheck | uv run mypy --strict src tests
# unit      | uv run pytest -q -o addopts= tests
